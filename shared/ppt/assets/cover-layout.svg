<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1333.3 750" width="1333" height="750" font-family="Pretendard Variable, Pretendard, 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <!-- 표지 고정 레이아웃 와이어프레임 — PPT-MASTER.md 6.9 / 1 in = 100 단위, 16:9 (13.333 x 7.5 in) -->
  <rect width="1333.3" height="750" fill="#FFFFFF"/>
  <rect width="490" height="750" fill="#0B1F3A"/>

  <!-- 제안사 로고 자리: x 0.6, y 0.6, 높이 0.95 -->
  <rect x="60" y="60" width="160" height="95" fill="none" stroke="#BBC5D6" stroke-dasharray="6 4"/>
  <text x="140" y="104" fill="#BBC5D6" font-size="13" text-anchor="middle">제안사 로고</text>
  <text x="140" y="124" fill="#BBC5D6" font-size="11" text-anchor="middle">(흰색 반전, 원본 비율)</text>

  <!-- 핵심 축 3개: 첫 구분선 y 4.2, 간격 1.0 -->
  <g fill="#FFFFFF">
    <rect x="60" y="420" width="35" height="2" fill="#1F6FEB"/>
    <text x="60" y="455" font-size="19.4" font-weight="700">{축 1 제목}</text>
    <text x="60" y="478" font-size="12.5" fill="#BBC5D6">{축 1 제품·영문}</text>
    <rect x="60" y="520" width="35" height="2" fill="#1F6FEB"/>
    <text x="60" y="555" font-size="19.4" font-weight="700">{축 2 제목}</text>
    <text x="60" y="578" font-size="12.5" fill="#BBC5D6">{축 2 제품·영문}</text>
    <rect x="60" y="620" width="35" height="2" fill="#1F6FEB"/>
    <text x="60" y="655" font-size="19.4" font-weight="700">{축 3 제목}</text>
    <text x="60" y="678" font-size="12.5" fill="#BBC5D6">{축 3 제품·영문}</text>
  </g>

  <!-- 오른쪽 블록: x 5.5, 상단 y 2.5 -->
  <text x="550" y="266" font-size="16.7" font-weight="700" fill="#1F6FEB">{고객명} {사업·센터명}</text>
  <text x="550" y="340" font-size="50" font-weight="700" fill="#0B1F3A">{제목 1줄}</text>
  <text x="550" y="405" font-size="50" font-weight="700" fill="#0B1F3A">{제목 2줄}</text>
  <text x="550" y="465" font-size="19.4" fill="#222222">{부제 — 한 줄 요약}</text>
  <rect x="550" y="505" width="80" height="2" fill="#1F6FEB"/>
  <text x="550" y="552" font-size="12.5" fill="#5B6577">{YYYY. MM. DD} · {v1.0} · {회사명}</text>
  <text x="550" y="575" font-size="12.5" font-weight="700" fill="#5B6577">{보안 등급}</text>

  <!-- 치수 주석 (회색, 실제 표지에는 없음) -->
  <g fill="#8A94A6" font-size="11">
    <text x="498" y="740">← 왼쪽 패널 폭 4.9 in (Navy #0B1F3A)</text>
    <text x="550" y="235">x 5.5 in · 블록 상단 y 2.5 in</text>
    <text x="640" y="510">구분선 0.8 in · 1.5 pt · Blue</text>
    <text x="105" y="425">0.35 in</text>
    <text x="1325" y="740" text-anchor="end">트래커·하단 바·페이지 번호 없음</text>
  </g>
</svg>
