<!--
  web-admin 스킬 예시 화면 (가상 데이터)
  - 색: shared/web/themes/slate.md → scripts/theme-to-css.py --plain 로 생성한 변수
  - 구조·크기: shared/web/WEB-DESIGN.md 토큰
  - 실제 프로젝트는 Tailwind v4 빌드 + Pretendard 포함 + Lucide SVG 도우미 사용 (이 파일은 단독 미리보기용 순수 CSS)
-->
<style>
/* theme: slate — generated by scripts/theme-to-css.py, 직접 수정하지 말고 테마 파일을 고친 뒤 다시 생성 */
:root {
  --color-canvas: #0F172A;
  --color-surface: #1E293B;
  --color-surface-muted: #172236;
  --color-line: #334155;
  --color-line-strong: #7C8BA1;
  --color-fg: #F1F5F9;
  --color-fg-muted: #A3B1C6;
  --color-fg-subtle: #64748B;
  --color-primary: #60A5FA;
  --color-primary-hover: #93C5FD;
  --color-primary-tint: #1B3358;
  --color-focus: #60A5FA;
  --color-success: #34D399;
  --color-success-tint: #0F3A31;
  --color-warning: #FBBF24;
  --color-warning-tint: #3A2E0D;
  --color-chart-pending: #F59E0B;
  --color-danger: #F87171;
  --color-danger-hover: #FCA5A5;
  --color-danger-tint: #3F1F25;
  --color-nav: #020617;
  --color-nav-raised: #0B1220;
  --color-nav-active: #1E293B;
  --color-nav-fg: #CBD5E1;
  --color-nav-muted: #94A3B8;
  --color-nav-accent: #60A5FA;
}
[data-theme="light"] {
  --color-canvas: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-surface-muted: #F1F5F9;
  --color-line: #E2E8F0;
  --color-line-strong: #64748B;
  --color-fg: #0F172A;
  --color-fg-muted: #475569;
  --color-fg-subtle: #94A3B8;
  --color-primary: #2563EB;
  --color-primary-hover: #1D4ED8;
  --color-primary-tint: #EFF6FF;
  --color-focus: #2563EB;
  --color-success: #047857;
  --color-success-tint: #ECFDF5;
  --color-warning: #B45309;
  --color-warning-tint: #FFFBEB;
  --color-chart-pending: #D97706;
  --color-danger: #B91C1C;
  --color-danger-hover: #991B1B;
  --color-danger-tint: #FEF2F2;
  --color-nav: #0F172A;
  --color-nav-raised: #16233B;
  --color-nav-active: #1E293B;
  --color-nav-fg: #CBD5E1;
  --color-nav-muted: #94A3B8;
  --color-nav-accent: #60A5FA;
}

:root {
  --radius-control: 6px; --radius-card: 10px; --radius-pill: 9999px;
  --sidebar: 248px; --topbar: 56px; --row: 44px; --control: 36px;
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif;
  --shadow-card: 0 1px 2px rgb(16 24 40/.05), 0 1px 3px rgb(16 24 40/.06);
}
[data-theme="dark"], :root:not([data-theme]) { --shadow-card: none; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; line-height: 1.6; color: var(--color-fg); background: var(--color-canvas); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
svg.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.icon-18 { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--color-surface); color: var(--color-fg); padding: 8px 12px; border-radius: var(--radius-control); z-index: 50; }
.skip-link:focus { left: 8px; }

/* app shell */
.app { display: flex; min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); background: var(--color-nav); color: var(--color-nav-fg); display: flex; flex-direction: column; padding: 16px 12px; z-index: 30; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }
.brand-chip { width: 36px; height: 36px; border-radius: 8px; background: var(--color-primary); color: var(--color-surface); display: grid; place-items: center; }
.brand-name { font-weight: 700; font-size: 15px; color: #fff; line-height: 1.3; }
.brand-sub { font-size: 12px; color: var(--color-nav-muted); }
.nav-section { font-size: 12px; font-weight: 500; color: var(--color-nav-muted); padding: 16px 12px 6px; }
.nav-link { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--radius-control); color: var(--color-nav-fg); text-decoration: none; }
.nav-link:hover { background: var(--color-nav-raised); }
.nav-link[aria-current="page"] { background: var(--color-nav-active); color: #fff; font-weight: 600; }
.nav-link[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--color-nav-accent); }
.nav-link[aria-current="page"] svg { color: var(--color-nav-accent); }
.nav-bottom { margin-top: auto; }

.main { flex: 1; margin-left: var(--sidebar); min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--color-surface); border-bottom: 1px solid var(--color-line); }
.topbar .menu-button { display: none; }
.breadcrumb { display: flex; gap: 6px; align-items: center; color: var(--color-fg-muted); font-size: 13px; }
.breadcrumb strong { color: var(--color-fg); font-weight: 600; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.btn-icon { position: relative; width: var(--control); height: var(--control); display: grid; place-items: center; border: 0; background: transparent; color: var(--color-fg-muted); border-radius: var(--radius-control); }
.btn-icon:hover { background: var(--color-surface-muted); color: var(--color-fg); }
.dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-pill); background: var(--color-danger); color: var(--color-surface); font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.profile { display: flex; align-items: center; gap: 10px; padding-left: 12px; margin-left: 4px; border-left: 1px solid var(--color-line); }
.avatar { width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--color-primary-tint); color: var(--color-primary); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.profile-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.profile-role { font-size: 12px; color: var(--color-fg-muted); line-height: 1.3; }

.page { padding: 24px; }
.page-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-title { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; }
.page-desc { margin: 4px 0 0; color: var(--color-fg-muted); }
.btn { height: var(--control); padding: 0 14px; border-radius: var(--radius-control); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-line-strong); background: var(--color-surface); color: var(--color-fg); }
.btn:hover { background: var(--color-surface-muted); }
.btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-surface); font-weight: 600; }
.btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

/* grid-cols-1 md:grid-cols-3 */
.grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .span-3 { grid-column: span 3; } }

.card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-card); box-shadow: var(--shadow-card); min-width: 0; }
.card-header { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--color-line); }
.card-title { margin: 0; font-size: 15px; font-weight: 600; }
.card-header svg { color: var(--color-fg-muted); }
.card-header .meta { margin-left: auto; color: var(--color-fg-muted); font-size: 13px; }
.card-body { padding: 20px; }

.kpi { padding: 20px; text-decoration: none; color: inherit; display: block; }
.kpi-head { display: flex; justify-content: space-between; align-items: center; }
.kpi-label { color: var(--color-fg-muted); font-weight: 500; }
.kpi-icon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
.kpi-value { margin-top: 8px; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-unit { font-size: 15px; font-weight: 600; color: var(--color-fg-muted); margin-left: 2px; }
.kpi-foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-fg-muted); }
.trend { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; }
.t-primary { background: var(--color-primary-tint); color: var(--color-primary); }
.t-success { background: var(--color-success-tint); color: var(--color-success); }
.t-danger  { background: var(--color-danger-tint);  color: var(--color-danger); }
.c-success { color: var(--color-success); } .c-danger { color: var(--color-danger); }

.chart-placeholder { height: 260px; border: 1px dashed var(--color-line-strong); border-radius: var(--radius-control); background: var(--color-surface-muted); display: grid; place-items: center; text-align: center; color: var(--color-fg-muted); position: relative; overflow: hidden; }
.chart-placeholder svg.guide { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart-placeholder .label { position: relative; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-control); padding: 8px 14px; font-size: 13px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { height: 40px; padding: 0 14px; text-align: left; background: var(--color-surface-muted); color: var(--color-fg-muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--color-line); white-space: nowrap; }
td { height: var(--row); padding: 0 14px; border-bottom: 1px solid var(--color-line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-success { background: var(--color-success-tint); color: var(--color-success); }
.b-warning { background: var(--color-warning-tint); color: var(--color-warning); }
.b-danger  { background: var(--color-danger-tint);  color: var(--color-danger); }
.b-primary { background: var(--color-primary-tint); color: var(--color-primary); }
.card-footer { padding: 12px 20px; border-top: 1px solid var(--color-line); color: var(--color-fg-muted); font-size: 13px; }

/* 1024~1279: 아이콘 사이드바 / ~1023: 서랍 */
@media (max-width: 1279px) and (min-width: 1024px) {
  .sidebar { width: 68px; padding: 16px 10px; }
  .brand-text, .nav-section { display: none; }
  .nav-link span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand { padding: 4px 6px 20px; } .nav-link { justify-content: center; padding: 0; }
  .main { margin-left: 68px; }
}
@media (max-width: 1023px) {
  .sidebar { transform: translateX(-100%); transition: transform 180ms cubic-bezier(0.2, 0, 0, 1); }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .topbar .menu-button { display: grid; }
}
@media (max-width: 767px) {
  .page { padding: 16px; } .topbar { padding: 0 12px; }
  .profile-text, .breadcrumb .crumb-parent { display: none; }
}
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>
</head>

<script>
(function () {
  var root = document.documentElement;
  var KEY = 'theme';
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(KEY, t); } catch (e) {}
    var btn = document.getElementById('themeBtn');
    btn.setAttribute('aria-label', t === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
    btn.querySelector('.i-sun').style.display = t === 'dark' ? '' : 'none';
    btn.querySelector('.i-moon').style.display = t === 'dark' ? 'none' : '';
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var q = new URLSearchParams(location.search).get('theme');
  setTheme(q || saved || 'dark');
  document.getElementById('themeBtn').addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  var sb = document.getElementById('sidebar'), mb = document.getElementById('menuBtn');
  mb.addEventListener('click', function () {
    var open = sb.classList.toggle('open');
    mb.setAttribute('aria-expanded', String(open));
  });

  var nf = new Intl.NumberFormat('ko-KR');
  var nfc = new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 2 });
  document.querySelectorAll('[data-num]').forEach(function (el) {
    var n = Number(el.dataset.num);
    el.textContent = el.dataset.style === 'compact' ? nfc.format(n) : nf.format(n);
  });

  var orders = [
    ['ORD-24103', '이서연', '무선 이어폰', '2026-10-26', 129000, '결제 완료', 'success'],
    ['ORD-24102', '박지훈', '노트북 거치대', '2026-10-26', 45900, '배송 중', 'primary'],
    ['ORD-24101', '최민지', '기계식 키보드', '2026-10-25', 189000, '입금 대기', 'warning'],
    ['ORD-24100', '정우성', 'USB-C 허브', '2026-10-25', 62000, '결제 완료', 'success'],
    ['ORD-24099', '한예린', '모니터 암', '2026-10-24', 98000, '취소', 'danger']
  ];
  var tb = document.getElementById('orders');
  orders.forEach(function (o) {
    var tr = document.createElement('tr');
    [o[0], o[1], o[2], o[3]].forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    var amt = document.createElement('td'); amt.className = 'num'; amt.textContent = nf.format(o[4]) + '원'; tr.appendChild(amt);
    var st = document.createElement('td'); var b = document.createElement('span'); b.className = 'badge b-' + o[6]; b.textContent = o[5]; st.appendChild(b); tr.appendChild(st);
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
